spring.application.name=backend

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform is intentionally omitted — Hibernate 6 auto-detects PostgreSQL dialect

# JPA Configuration
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool Optimization for AWS RDS
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=FlowTrackHikariPool

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION}

# Server Configuration & GZIP Compression
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Enterprise Mail Service Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ScalozFlow Application Properties
flowtrack.frontend.url=${FRONTEND_URL:}
scaloz.workspace.jwtSecret=${SCALOZ_WORKSPACE_JWT_SECRET:${JWT_SECRET}}
encryption.key=${ENCRYPTION_KEY:super-secret-aes-key-for-payloads-2026!}
flowtrack.integration.api-key=${INTEGRATION_API_KEY:xevyte_secure_api_key_2026_prod_v1}
flowtrack.skip-payload-encryption=${SKIP_PAYLOAD_ENCRYPTION:false}

# Admin Initialization Properties
flowtrack.admin.email=${ADMIN_EMAIL:}
flowtrack.admin.password=${ADMIN_PASSWORD:}
flowtrack.admin.empId=${ADMIN_EMPID:}

# AWS S3 Storage Configuration (Loaded from EC2 / .env)
aws.s3.bucket-name=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION}

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
